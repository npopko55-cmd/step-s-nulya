<script>

(function () {
  'use strict';

  var KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'erid'];
  var DOMAIN = 'walk-walk.ru';

  function collectParams() {
    var out = [];
    try {
      var q = new URLSearchParams(window.location.search);
      for (var i = 0; i < KEYS.length; i++) {
        var v = q.get(KEYS[i]);
        if (v) out.push([KEYS[i], v]);
      }
    } catch (err) {}
    return out;
  }
  var params = collectParams();

  function withUtm(href) {
    if (!params.length || !href || href.indexOf(DOMAIN) === -1) return href;
    try {
      var u = new URL(href, window.location.href);
      for (var i = 0; i < params.length; i++) {
        if (!u.searchParams.has(params[i][0])) u.searchParams.set(params[i][0], params[i][1]);
      }
      return u.toString();
    } catch (err) { return href; }
  }

  function decorateLinks() {
    if (!params.length) return;
    var links = document.querySelectorAll('a[href*="' + DOMAIN + '"]');
    for (var i = 0; i < links.length; i++) {
      var next = withUtm(links[i].getAttribute('href'));
      if (next !== links[i].getAttribute('href')) links[i].setAttribute('href', next);
    }
  }
  decorateLinks();

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href*="' + DOMAIN + '"]') : null;
    if (a) a.setAttribute('href', withUtm(a.getAttribute('href')));
  }, true);

  var METRIKA_ID = 94057307;
  function goal(name) {
    try {
      if (typeof window.ym === 'function') window.ym(METRIKA_ID, 'reachGoal', 'step-' + name);
    } catch (err) {}
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-goal]') : null;
    if (el) goal(el.getAttribute('data-goal'));
  });

  var periods = document.querySelectorAll('.period');
  var cta = document.getElementById('clubCta');

  function select(btn) {
    for (var i = 0; i < periods.length; i++) {
      var on = periods[i] === btn;
      periods[i].classList.toggle('is-active', on);
      periods[i].setAttribute('aria-checked', on ? 'true' : 'false');
      periods[i].setAttribute('tabindex', on ? '0' : '-1');
    }
    if (cta && btn.getAttribute('data-href')) cta.setAttribute('href', withUtm(btn.getAttribute('data-href')));
  }

  for (var p = 0; p < periods.length; p++) {
    periods[p].addEventListener('click', function () { select(this); });
    periods[p].addEventListener('keydown', function (e) {
      var list = Array.prototype.slice.call(periods);
      var idx = list.indexOf(this);
      var to = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') to = (idx + 1) % list.length;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') to = (idx - 1 + list.length) % list.length;
      if (to > -1) { e.preventDefault(); select(list[to]); list[to].focus(); }
    });
  }
  var active = document.querySelector('.period.is-active') || periods[periods.length - 1];
  if (active) select(active);

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var target = id ? document.getElementById(id) : null;
    if (!target) return;
    e.preventDefault();
    var top = target.getBoundingClientRect().top + window.pageYOffset;
    try { window.scrollTo({ top: top, behavior: 'smooth' }); } catch (err) { window.scrollTo(0, top); }
  });
})();

</script>
